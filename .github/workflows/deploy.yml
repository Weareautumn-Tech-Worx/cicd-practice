name: Build and Deploy with Docker

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/weareautumn-tech-worx/cicd-practice

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull ghcr.io/weareautumn-tech-worx/cicd-practice:${{ github.sha }}

            # Stop/remove the container named "cicd" if it exists
            docker stop cicd || true
            docker rm cicd || true

            # Stop/remove ANY other container publishing host port 3000
            ids=$(docker ps --format '{{.ID}} {{.Ports}}' | awk -v p=':3000' '$0~p{print $1}')
            if [ -n "$ids" ]; then
              echo "Stopping other containers using port 3000: $ids"
              docker stop $ids || true
              docker rm $ids || true
            fi

            docker run -d \
              --name cicd \
              --restart unless-stopped \
              -p 3000:3000 \
              ghcr.io/weareautumn-tech-worx/cicd-practice:${{ github.sha }}
