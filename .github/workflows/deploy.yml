name: Build and Deploy with Docker

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/weareautumn-tech-worx/cicd-practice

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Deploy Docker container to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting Docker deployment..."
            echo "======================================"

            echo "Logging into GitHub Container Registry..."

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo "======================================"
            echo "Pulling Docker image..."
            echo "======================================"

            docker pull ghcr.io/weareautumn-tech-worx/cicd-practice:${{ github.sha }}

            echo "======================================"
            echo "Current Docker containers:"
            echo "======================================"

            docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}" || true

            echo "======================================"
            echo "Checking port 3000 before deployment..."
            echo "======================================"

            sudo ss -ltnp 'sport = :3000' || true

            echo "======================================"
            echo "Stopping existing container named app..."
            echo "======================================"

            docker stop cicd || true
            docker rm cicd || true

            echo "======================================"
            echo "Checking if any Docker container is using port 3000..."
            echo "======================================"

            docker ps --format '{{.ID}}\t{{.Names}}\t{{.Ports}}' | grep '0.0.0.0:3000' || true

            echo "======================================"
            echo "Checking port 3000 after stopping app..."
            echo "======================================"

            sudo ss -ltnp 'sport = :3000' || true

            echo "======================================"
            echo "Starting new Docker container..."
            echo "======================================"

            docker run -d \
              --name cicd \
              --restart unless-stopped \
              -p 3000:3000 \
              ghcr.io/weareautumn-tech-worx/cicd-practice:${{ github.sha }}

            echo "======================================"
            echo "Container started successfully"
            echo "======================================"

            echo "Container status:"
            docker ps --filter "name=cicd"

            echo "======================================"
            echo "Container logs:"
            echo "======================================"

            docker logs --tail 50 cicd

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
