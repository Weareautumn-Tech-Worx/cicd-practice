name: Build and Deploy with Docker

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/weareautumn-tech-worx/cicd-practice

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
  needs: build-and-push
  runs-on: ubuntu-latest

  steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |
          set -e

          echo "Logging into GitHub Container Registry..."

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

          echo "Pulling latest image..."

          docker pull ghcr.io/weareautumn-tech-worx/cicd-practice:${{ github.sha }}

          echo "Checking port 3000..."

          sudo ss -ltnp 'sport = :3000' || true

          echo "Stopping old app container..."

          docker stop app || true
          docker rm app || true

          echo "Checking port 3000 after removing app..."

          sudo ss -ltnp 'sport = :3000' || true

          echo "Starting new container..."

          docker run -d \
            --name app \
            --restart unless-stopped \
            -p 3000:3000 \
            ghcr.io/weareautumn-tech-worx/cicd-practice:${{ github.sha }}

          echo "Deployment completed successfully!"

          docker ps
